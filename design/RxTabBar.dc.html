<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:0;right:0;bottom:0;height:86px;background:var(--bg);border-top:1px solid var(--ln);display:flex;align-items:flex-start;padding:8px 8px 0;box-sizing:border-box;font-family:'Atkinson Hyperlegible Next',sans-serif">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:52px;justify-content:center;color:{{ t.c }}">
      <sc-if value="{{ t.plus }}"><div style="width:56px;height:44px;border-radius:14px;background:var(--amb);color:#1A1410;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 0 #B0500E;display:grid;place-items:center"><i class="icon-plus" style="font-size:24px"></i></div></sc-if>
      <sc-if value="{{ t.normal }}"><i class="{{ t.icon }}" style="font-size:23px"></i><span style="font:500 14px 'Atkinson Hyperlegible Next'">{{ t.label }}</span></sc-if>
    </div>
  </sc-for>
  <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--fg);opacity:.85"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;coleccion&quot;,&quot;deseos&quot;,&quot;mas&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){ const a=this.props.active||'inicio';
    return {tabs:[['inicio','Inicio','icon-house'],['coleccion','Colección','icon-library-big'],['add','','icon-plus'],['deseos','Deseos','icon-heart'],['mas','Más','icon-ellipsis']].map(([k,label,icon])=>({label,icon,plus:k==='add',normal:k!=='add',c:a===k?'var(--ambtx)':'var(--fg3)'}))}; }
}
</script>
</body>
</html>
